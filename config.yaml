# CyberSafe Network Monitor Configuration

# Network Interface Settings
network:
  interface: "auto"  # Auto-detect or specify: eth0, wlan0, etc.
  promiscuous_mode: true
  buffer_size: 65536
  capture_filter: ""  # BPF filter syntax

# Packet Capture Settings
capture:
  max_packets: 10000  # Maximum packets to store in memory
  packet_timeout: 1   # Timeout in seconds
  store_payload: true
  max_payload_size: 1500

# Threat Detection
threats:
  enabled: true
  sensitivity: "medium"  # low, medium, high
  
  # Port Scan Detection
  port_scan:
    enabled: true
    threshold: 20  # Connections to different ports within time_window
    time_window: 10  # seconds
    
  # SYN Flood Detection
  syn_flood:
    enabled: true
    threshold: 100  # SYN packets per second
    time_window: 1
    
  # DDoS Detection
  ddos:
    enabled: true
    packet_threshold: 1000  # Packets per second from single source
    connection_threshold: 100  # Concurrent connections
    
  # Brute Force Detection
  brute_force:
    enabled: true
    failed_attempts: 5
    time_window: 60  # seconds
    
  # Data Exfiltration
  exfiltration:
    enabled: true
    data_threshold: 100  # MB per connection
    connection_threshold: 10  # Connections to same external host

# Port Monitoring
ports:
  monitor_all: true
  suspicious_ports: [23, 135, 139, 445, 1433, 3306, 3389, 5432]
  whitelist: []
  blacklist: []

# Protocol Analysis
protocols:
  analyze_http: true
  analyze_dns: true
  analyze_tls: true
  analyze_smtp: true
  analyze_ftp: true
  deep_inspection: true

# Database
database:
  type: "sqlite"  # sqlite, postgresql, mysql
  path: "data/network_monitor.db"
  retention_days: 30
  auto_vacuum: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console: true
  file: true
  log_path: "logs/"
  max_file_size: 10  # MB
  backup_count: 5

# Alerts
alerts:
  enabled: true
  methods:
    console: true
    file: true
    email: false
    webhook: false
  
  email:
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    to_addresses: []
    
  webhook:
    url: ""
    headers: {}

# API Server
api:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  debug: false
  cors_enabled: true
  auth_required: false
  api_key: ""

# WebSocket
websocket:
  enabled: true
  update_interval: 1  # seconds
  max_clients: 10

# GUI Settings
gui:
  theme: "dark"  # dark, light
  refresh_rate: 1000  # milliseconds
  max_display_packets: 1000
  auto_scroll: true

# GeoIP
geoip:
  enabled: true
  database_path: "data/GeoLite2-City.mmdb"
  update_interval: 7  # days

# Performance
performance:
  max_threads: 4
  buffer_packets: true
  batch_size: 100
  
# Export
export:
  format: "pcap"  # pcap, json, csv
  auto_export: false
  export_path: "exports/"
  compression: true
